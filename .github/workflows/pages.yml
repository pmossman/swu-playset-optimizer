# Build the static site (fresh TCGPlayer prices via TCGCSV) and publish it to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * *' # daily, after TCGCSV's ~20:00 UTC price update
  workflow_dispatch: # "Run workflow" button for an on-demand price refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build # CI=true, so prices are always re-downloaded; any fetch failure stops the deploy
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # GitHub pauses scheduled workflows in a public repo after 60 days without commits,
  # which would quietly stop the daily price (and new-set) updates. Re-enabling the
  # workflow through the API each scheduled run keeps it going. If it ever lapses
  # anyway, the site warns visitors once prices are more than 3 days old.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
